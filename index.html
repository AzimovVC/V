<!doctype html>
<html lang="ru" translate="no">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Language" content="ru">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0b0a">
<title>Дом внутри</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>

  <div id="hud" hidden>
    <div id="hud-left">
      <div id="energy" title="Огонёк">
        <svg viewBox="0 0 24 32" aria-hidden="true"><path id="flame" d="M12 1c1 5 8 9 8 18a8 8 0 0 1-16 0c0-4 2-6 4-8 0 3 1 4 2 4 0-5-1-9 2-14z"/></svg>
        <div class="bar"><i id="energy-fill"></i></div>
      </div>
      <div id="chips"><span id="chip-weather"></span><span id="chip-debt" hidden></span><span id="chip-tidy" hidden></span><span id="chip-tenant" hidden></span></div>
    </div>
    <div id="hud-right">
      <button id="btn-bag" class="small">Рюкзак</button>
      <button id="btn-furnish" class="small" hidden>Обустроить</button>
      <button id="btn-mute" class="small" aria-label="Звук">♪</button>
    </div>
    <div id="roomname"></div>
    <div id="notice" aria-hidden="true"><svg viewBox="0 0 40 20"><path d="M2 10C10 1 30 1 38 10 30 19 10 19 2 10z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="10" r="4" fill="currentColor"/></svg><i></i></div>
  </div>

  <div id="subtitle"></div>
  <div id="toast"></div>

  <div id="controls" hidden>
    <div id="pad">
      <button id="btn-left" aria-label="Влево">◀</button>
      <button id="btn-right" aria-label="Вправо">▶</button>
    </div>
    <button id="btn-act"><b id="act-icon"></b><span id="act-label"></span><i id="act-prog"></i></button>
  </div>

  <div id="modal" hidden></div>

  <div id="title">
    <div class="title-card">
      <h1>Дом внутри</h1>
      <p class="sub">карта, а не диагноз</p>
      <p class="tip">Лучше в наушниках. Звук здесь важнее картинки.</p>
      <div class="title-buttons">
        <button id="btn-continue" hidden>Продолжить</button>
        <button id="btn-new">Начать</button>
      </div>
      <p class="foot">◀ ▶ — идти · кнопка справа — действие<br>клавиатура: ← → / A D, пробел / E — действие, B — рюкзак, F — мебель, M — звук</p>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
